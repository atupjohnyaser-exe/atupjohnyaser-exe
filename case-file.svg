  <g class="rise" style="animation-delay:1.2s">
    <text x="24"  y="600" class="mono dim label">REPOSITORIES</text>
    <text x="24"  y="624" class="sans txt val">00</text>
    <text x="264" y="600" class="mono dim label">COMMITS</text>
    <text x="264" y="624" class="sans txt val">000</text>
    <text x="504" y="600" class="mono dim label">BUGS FIXED / OPEN</text>
    <text x="504" y="624" class="sans txt val">0 / ∞</text>
    <text x="744" y="600" class="mono dim label">OPEN WARRANTS</text>
    <text x="744" y="624" class="sans txt val">8 OF 8</text>
  </g>

  <!-- ambient layers -->
  <g clip-path="url(#rail)">
    <rect class="shine" x="0" y="164" width="160" height="6" fill="url(#shineg)"/>
    <rect class="shine" x="0" y="214" width="160" height="4" fill="url(#shineg)" opacity="0.6" style="animation-delay:-1.7s"/>
    <rect class="shine" x="0" y="570" width="160" height="4" fill="url(#shineg)" opacity="0.6" style="animation-delay:-3.4s"/>
  </g>
  <rect class="sweep" x="0" y="0" width="980" height="70" fill="url(#sweepg)"/>
</svg>
