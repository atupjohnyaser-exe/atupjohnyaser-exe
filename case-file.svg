<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" role="img" aria-label="Case file ASHTHRONE56-exe">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Arial Narrow', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .lime { fill: #b6ff2e; }
    .txt { fill: #eef3ee; }
    .dim { fill: #5f705f; }
    .org { fill: #ffb347; }
    .label { font-size: 11px; letter-spacing: 1.5px; }
    .val { font-size: 17px; }
    .head { font-size: 15px; letter-spacing: 1.5px; }
    .fb { transform-box: fill-box; }

    /* page load: rows rise in one by one */
    .rise { animation: rise .7s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* typing title (retypes every 16s) */
    .tcov { animation: tcov 16s steps(26, end) infinite; }
    .tcur { animation: tcur 16s steps(26, end) infinite, blink 1s steps(1) infinite; }
    .tcov { transform-box: fill-box; transform-origin: 100% 50%; }
    @keyframes tcov { 0% { transform: scaleX(1); } 14%, 100% { transform: scaleX(0); } }
    @keyframes tcur { 0% { transform: translateX(-602px); } 14%, 100% { transform: translateX(0); } }
    @keyframes blink { 50% { opacity: 0; } }

    /* occasional glitch on the title */
    .gl1 { opacity: 0; animation: glitch1 9s linear infinite; }
    .gl2 { opacity: 0; animation: glitch2 9s linear infinite; }
    @keyframes glitch1 { 0%, 90% { opacity: 0; transform: translateX(0); } 91% { opacity: .7; transform: translateX(-3px); } 93% { opacity: 0; } 95% { opacity: .6; transform: translateX(2px); } 97%, 100% { opacity: 0; } }
    @keyframes glitch2 { 0%, 90% { opacity: 0; transform: translateX(0); } 92% { opacity: .7; transform: translateX(3px); } 94% { opacity: 0; } 96% { opacity: .6; transform: translateX(-2px); } 98%, 100% { opacity: 0; } }

    /* ambient */
    .sweep { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateY(-70px); } to { transform: translateY(580px); } }
    .shine { animation: shine 5s linear infinite; }
    @keyframes shine { from { transform: translateX(-160px); } to { transform: translateX(1000px); } }
    .ring { transform-origin: center; animation: ring 2s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.8); opacity: 0; } }
    .blip { animation: blip 2s ease-in-out infinite; }
    @keyframes blip { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .warn { animation: warn 2.4s ease-in-out infinite; }
    @keyframes warn { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .brk { animation: brk 3s ease-in-out infinite; }
    @keyframes brk { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b6ff2e" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#b6ff2e" fill-opacity="0.035"/>
    </pattern>
    <linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ff2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b6ff2e" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#b6ff2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaffb0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eaffb0" stop-opacity="1"/>
      <stop offset="1" stop-color="#eaffb0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rail"><rect x="24" y="0" width="932" height="580"/></clipPath>
    <clipPath id="btn"><rect x="766" y="24" width="190" height="40"/></clipPath>
  </defs>

  <rect width="980" height="580" fill="#0a0d0a"/>
  <rect width="980" height="580" fill="url(#grid)"/>
  <rect width="980" height="580" fill="url(#lines)"/>
  <path d="M0.5 0.5H979.5M0.5 0V580M979.5 0V580" stroke="#2c3a2c" fill="none"/>
  <path class="brk" d="M2 22V2H22M978 22V2H958" stroke="#b6ff2e" stroke-width="2" fill="none" filter="url(#glow)"/>

  <!-- top bar -->
  <rect x="24" y="24" width="160" height="40" fill="#4b6a14" opacity="0.8"/>
  <text x="104" y="49" class="mono lime" font-size="12" letter-spacing="1.5" text-anchor="middle" opacity="0.6">← BACK TO RECORD</text>

  <circle cx="350" cy="44" r="3" fill="#b6ff2e" filter="url(#glow)"/>
  <circle class="ring fb" cx="350" cy="44" r="3" fill="none" stroke="#b6ff2e"/>
  <text x="490" y="48" class="mono dim" font-size="11" letter-spacing="2" text-anchor="middle">SYSTEM ONLINE // SIGNAL 100%</text>

  <rect x="766" y="24" width="190" height="40" fill="#b6ff2e" filter="url(#glow)"/>
  <g clip-path="url(#btn)"><rect class="shine" x="766" y="24" width="120" height="40" fill="url(#shineg)" opacity="0.8"/></g>
  <text x="861" y="49" class="mono" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#0a0d0a">VIEW / FOLLOW ▸</text>

  <!-- header -->
  <text x="24" y="102" class="mono lime" font-size="12" font-weight="700" letter-spacing="2">GITHUB DEPARTMENT // PROFILE DIVISION</text>
  <text class="gl1" x="24" y="148" font-family="'Arial Narrow','Segoe UI',Arial,sans-serif" font-weight="700" font-size="42" fill="#00e5ff" textLength="590" lengthAdjust="spacingAndGlyphs">CASE FILE ASHTHRONE56-EXE</text>
  <text class="gl2" x="24" y="148" font-family="'Arial Narrow','Segoe UI',Arial,sans-serif" font-weight="700" font-size="42" fill="#ff2bd6" textLength="590" lengthAdjust="spacingAndGlyphs">CASE FILE ASHTHRONE56-EXE</text>
  <text x="24" y="148" class="sans txt" font-size="42" textLength="590" lengthAdjust="spacingAndGlyphs">CASE FILE ASHTHRONE56-EXE</text>
  <rect class="tcov" x="24" y="108" width="616" height="50" fill="#0a0d0a"/>
  <rect class="tcur lime" x="626" y="118" width="16" height="30" filter="url(#glow)"/>
  <text x="956" y="128" class="mono dim" font-size="12" letter-spacing="1" text-anchor="end">GENERATED 02 NOV 2026</text>
  <text x="956" y="148" class="mono dim" font-size="12" letter-spacing="1" text-anchor="end">BY ASHTHRONE56-exe</text>
  <rect x="24" y="166" width="932" height="2" fill="#b6ff2e" filter="url(#glow)"/>

  <!-- SUBJECT -->
  <g class="rise" style="animation-delay:.15s">
    <text x="24" y="206" class="sans lime head">SUBJECT</text>
    <circle class="blip" cx="863" cy="202.5" r="2.5" fill="#b6ff2e"/>
    <text x="956" y="206" class="mono dim" font-size="10" letter-spacing="1.5" text-anchor="end" textLength="83" lengthAdjust="spacing">ID VERIFIED</text>
    <rect x="24" y="216" width="932" height="1" fill="#2c3a2c"/>
  </g>

  <g class="rise" style="animation-delay:.3s">
    <text x="24"  y="244" class="mono dim label">NAME</text>
    <text x="24"  y="268" class="sans txt val">ASHTHRONE56-exe</text>
    <text x="264" y="244" class="mono dim label">ALIAS</text>
    <text x="264" y="268" class="sans txt val">Destro</text>
    <text x="504" y="244" class="mono dim label">ROLE</text>
    <text x="504" y="268" class="sans txt val">Developer</text>
    <text x="744" y="244" class="mono dim label">STATUS</text>
    <circle cx="749" cy="263" r="3.5" fill="#b6ff2e" filter="url(#glow)"/>
    <circle class="ring fb" cx="749" cy="263" r="3.5" fill="none" stroke="#b6ff2e"/>
    <text x="762" y="268" class="sans txt val">ACTIVE / BUILDING</text>
  </g>

  <g class="rise" style="animation-delay:.45s">
    <text x="24"  y="304" class="mono dim label">THREAT LEVEL</text>
    <text x="24"  y="328" class="sans org val warn">3 // HIGH</text>
    <text x="264" y="304" class="mono dim label">LAST KNOWN LOCATION</text>
    <text x="264" y="328" class="sans txt val">Philippines</text>
    <text x="504" y="304" class="mono dim label">LANGUAGES</text>
    <text x="504" y="328" class="sans txt val">Python / JS / Lua</text>
    <text x="744" y="304" class="mono dim label">DISTINGUISHING FEATURES</text>
    <text x="744" y="328" class="sans txt val">ships code at 1 AM</text>
  </g>

  <g class="rise" style="animation-delay:.6s">
    <text x="24" y="368" class="mono org label" font-weight="700">SUGGESTED RESPONSE</text>
    <text x="24" y="392" class="sans txt val">Approach with a pull request. Coffee with HIGH Caffeine Recommended.</text>
  </g>

  <g class="rise" style="animation-delay:.75s">
    <text x="24" y="428" class="mono org label" font-weight="700">OFFICER ADVISORY</text>
    <text x="24" y="452" class="sans txt val">Proceed with curiosity</text>
  </g>

  <!-- SUMMARY -->
  <g class="rise" style="animation-delay:.9s">
    <text x="24" y="494" class="sans lime head">SUMMARY</text>
    <circle class="blip" cx="863" cy="490.5" r="2.5" fill="#b6ff2e" style="animation-delay:.6s"/>
    <text x="956" y="494" class="mono dim" font-size="10" letter-spacing="1.5" text-anchor="end" textLength="83" lengthAdjust="spacing">DATA SYNCED</text>
    <rect x="24" y="504" width="932" height="1" fill="#2c3a2c"/>
  </g>

  <g class="rise" style="animation-delay:1.05s">
    <text x="24"  y="532" class="mono dim label">REPOSITORIES</text>
    <text x="24"  y="556" class="sans txt val">00</text>
    <text x="264" y="532" class="mono dim label">COMMITS</text>
    <text x="264" y="556" class="sans txt val">000</text>
    <text x="504" y="532" class="mono dim label">BUGS FIXED / OPEN</text>
    <text x="504" y="556" class="sans txt val">0 / ∞</text>
    <text x="744" y="532" class="mono dim label">OPEN WARRANTS</text>
    <text x="744" y="556" class="sans txt val">8 OF 8</text>
  </g>

  <!-- ambient layers -->
  <g clip-path="url(#rail)">
    <rect class="shine" x="0" y="164" width="160" height="6" fill="url(#shineg)"/>
    <rect class="shine" x="0" y="214" width="160" height="4" fill="url(#shineg)" opacity="0.6" style="animation-delay:-1.7s"/>
    <rect class="shine" x="0" y="502" width="160" height="4" fill="url(#shineg)" opacity="0.6" style="animation-delay:-3.4s"/>
  </g>
  <rect class="sweep" x="0" y="0" width="980" height="70" fill="url(#sweepg)"/>
</svg>
