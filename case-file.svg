    <text x="684" y="328" class="sans txt val">Philippines</text>
  </g>

  <g class="rise" style="animation-delay:.6s">
    <text x="204" y="364" class="mono dim label">LANGUAGES</text>
    <text x="204" y="388" class="sans txt val">Python / JS / Lua</text>
    <text x="444" y="364" class="mono dim label">DISTINGUISHING FEATURES</text>
    <text x="444" y="388" class="sans txt val">ships code at 1 AM</text>
    <text x="684" y="364" class="mono dim label">CASE ID</text>
    <text x="684" y="388" class="sans txt val">RP-ASH-001</text>
  </g>

  <g class="rise" style="animation-delay:.75s">
    <text x="24" y="436" class="mono org label" font-weight="700">SUGGESTED RESPONSE</text>
    <text x="24" y="460" class="sans txt val">Approach with a pull request. Coffee recommended.</text>
  </g>

  <g class="rise" style="animation-delay:.9s">
    <text x="24" y="496" class="mono org label" font-weight="700">OFFICER ADVISORY</text>
    <text x="24" y="520" class="sans txt val">Proceed with curiosity</text>
  </g>

  <!-- SUMMARY -->
  <g class="rise" style="animation-delay:1.05s">
    <text x="24" y="562" class="sans lime head">SUMMARY</text>
    <circle class="blip" cx="863" cy="558.5" r="2.5" fill="#b6ff2e" style="animation-delay:.6s"/>
    <text x="956" y="562" class="mono dim" font-size="10" letter-spacing="1.5" text-anchor="end" textLength="83" lengthAdjust="spacing">DATA SYNCED</text>
    <rect x="24" y="572" width="932" height="1" fill="#2c3a2c"/>
