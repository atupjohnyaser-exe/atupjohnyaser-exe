<svg xmlns="http://www.w3.org/2000/svg" width="980" height="276" viewBox="0 0 980 276" role="img" aria-label="Activity log">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Arial Narrow', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .lime { fill: #b6ff2e; }
    .txt { fill: #eef3ee; }
    .dim { fill: #5f705f; }
    .head { font-size: 15px; letter-spacing: 1.5px; }
    .fb { transform-box: fill-box; }

    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: grow 9s ease-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 14%, 100% { transform: scaleX(1); } }
    .pct { animation: pct 9s ease-out infinite; }
    @keyframes pct { 0%, 6% { opacity: 0; } 18%, 100% { opacity: 1; } }

    .blip { animation: blip 2s ease-in-out infinite; }
    @keyframes blip { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .sweep { animation: scan 6.5s linear infinite; }
    @keyframes scan { from { transform: translateY(-70px); } to { transform: translateY(276px); } }
    .shine { animation: shine 5s linear infinite; }
    @keyframes shine { from { transform: translateX(-160px); } to { transform: translateX(1000px); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b6ff2e" stroke-opacity="0.045"/>
    </pattern>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#b6ff2e" fill-opacity="0.035"/>
    </pattern>
    <linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ff2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b6ff2e" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#b6ff2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaffb0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eaffb0" stop-opacity="1"/>
      <stop offset="1" stop-color="#eaffb0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rail"><rect x="24" y="0" width="932" height="276"/></clipPath>
  </defs>

  <rect width="980" height="276" fill="#0a0d0a"/>
  <rect width="980" height="276" fill="url(#grid)"/>
  <rect width="980" height="276" fill="url(#lines)"/>
  <path d="M0.5 0V276M979.5 0V276" stroke="#2c3a2c" fill="none"/>

  <text x="24" y="36" class="sans lime head">ACTIVITY LOG</text>
  <circle class="blip" cx="878" cy="32.5" r="2.5" fill="#b6ff2e"/>
  <text x="956" y="36" class="mono dim" font-size="10" letter-spacing="1.5" text-anchor="end" textLength="68" lengthAdjust="spacing">LIVE FEED</text>
  <rect x="24" y="46" width="932" height="1" fill="#2c3a2c"/>

  <text x="24" y="78" class="mono dim" font-size="11" letter-spacing="1.5">LANGUAGE USAGE</text>

  <!-- scale ticks: 25 / 50 / 75 % of the 652px track -->
  <g stroke="#2c3a2c" stroke-width="1">
    <path d="M347 92V224M510 92V224M673 92V224" stroke-dasharray="2 4"/>
  </g>

  <!-- track: x=184, width=652 -->
  <g class="mono" font-size="13" font-weight="700">
    <text x="24" y="110" class="txt">PYTHON</text>
    <rect x="184" y="99" width="652" height="12" fill="#1a241a"/>
    <rect class="bar" x="184" y="99" width="261" height="12" fill="#b6ff2e" filter="url(#glow)" style="animation-delay:0s"/>
    <text x="956" y="110" class="lime pct" text-anchor="end" style="animation-delay:0s">40%</text>

    <text x="24" y="146" class="txt">JAVASCRIPT</text>
    <rect x="184" y="135" width="652" height="12" fill="#1a241a"/>
    <rect class="bar" x="184" y="135" width="196" height="12" fill="#b6ff2e" filter="url(#glow)" style="animation-delay:.2s"/>
    <text x="956" y="146" class="lime pct" text-anchor="end" style="animation-delay:.2s">30%</text>

    <text x="24" y="182" class="txt">LUA</text>
    <rect x="184" y="171" width="652" height="12" fill="#1a241a"/>
    <rect class="bar" x="184" y="171" width="98" height="12" fill="#b6ff2e" filter="url(#glow)" style="animation-delay:.4s"/>
    <text x="956" y="182" class="lime pct" text-anchor="end" style="animation-delay:.4s">15%</text>

    <text x="24" y="218" class="txt">HTML / CSS</text>
    <rect x="184" y="207" width="652" height="12" fill="#1a241a"/>
    <rect class="bar" x="184" y="207" width="98" height="12" fill="#b6ff2e" filter="url(#glow)" style="animation-delay:.6s"/>
    <text x="956" y="218" class="lime pct" text-anchor="end" style="animation-delay:.6s">15%</text>
  </g>

  <text x="956" y="256" class="mono dim" font-size="10" letter-spacing="1" text-anchor="end">SAMPLE DATA // EDIT IN activity.svg</text>

  <g clip-path="url(#rail)">
    <rect class="shine" x="0" y="44" width="160" height="4" fill="url(#shineg)" opacity="0.6" style="animation-delay:-3.5s"/>
  </g>
  <rect class="sweep" x="0" y="0" width="980" height="70" fill="url(#sweepg)" style="animation-delay:-4s"/>
</svg>
