<svg xmlns="http://www.w3.org/2000/svg" width="980" height="215" viewBox="0 0 980 215" role="img" aria-label="Activity log">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Arial Narrow', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .lime { fill: #b6ff2e; }
    .txt { fill: #eef3ee; }
    .dim { fill: #5f705f; }
  </style>
  <rect width="980" height="215" fill="#0a0d0a"/>

  <text x="10" y="30" class="sans lime" font-size="15" letter-spacing="1.5">ACTIVITY LOG</text>
  <rect x="10" y="39" width="960" height="1" fill="#2c3a2c"/>

  <text x="10" y="68" class="mono dim" font-size="11" letter-spacing="1.5">LANGUAGE USAGE</text>

  <!-- track x=170..850 (680 wide) -->
  <g class="mono" font-size="13">
    <text x="10" y="98" class="txt" font-weight="700">PYTHON</text>
    <rect x="170" y="87" width="680" height="12" fill="#1a241a"/>
    <rect x="170" y="87" width="272" height="12" fill="#b6ff2e"/>
    <text x="970" y="98" class="lime" text-anchor="end" font-weight="700">40%</text>

    <text x="10" y="128" class="txt" font-weight="700">JAVASCRIPT</text>
    <rect x="170" y="117" width="680" height="12" fill="#1a241a"/>
    <rect x="170" y="117" width="204" height="12" fill="#b6ff2e"/>
    <text x="970" y="128" class="lime" text-anchor="end" font-weight="700">30%</text>

    <text x="10" y="158" class="txt" font-weight="700">LUA</text>
    <rect x="170" y="147" width="680" height="12" fill="#1a241a"/>
    <rect x="170" y="147" width="102" height="12" fill="#b6ff2e"/>
    <text x="970" y="158" class="lime" text-anchor="end" font-weight="700">15%</text>

    <text x="10" y="188" class="txt" font-weight="700">HTML / CSS</text>
    <rect x="170" y="177" width="680" height="12" fill="#1a241a"/>
    <rect x="170" y="177" width="102" height="12" fill="#b6ff2e"/>
    <text x="970" y="188" class="lime" text-anchor="end" font-weight="700">15%</text>
  </g>

  <text x="970" y="208" class="mono dim" font-size="10" letter-spacing="1" text-anchor="end">SAMPLE DATA // EDIT IN activity.svg</text>
</svg>
