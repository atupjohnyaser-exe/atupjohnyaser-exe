<svg xmlns="http://www.w3.org/2000/svg" width="980" height="346" viewBox="0 0 980 346" role="img" aria-label="Activity log">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Arial Narrow', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .lime { fill: #b6ff2e; }
    .red { fill: #ff2e4d; }
    .txt { fill: #eef3ee; }
    .dim { fill: #5f705f; }
    .label { font-size: 11px; letter-spacing: 1.5px; }
    .val { font-size: 17px; }
    .fb { transform-box: fill-box; }
    .blip { animation: blip 2s ease-in-out infinite; }
    @keyframes blip { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .sweep { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateY(-70px); } to { transform: translateY(346px); } }
    .shine { animation: shine 5s linear infinite; }
    @keyframes shine { from { transform: translateX(-160px); } to { transform: translateX(1000px); } }
    .brk { animation: brk 3s ease-in-out infinite; }
    @keyframes brk { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .ring { transform-origin: center; animation: ring 2s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes eq0 { 0%,100% { transform: scaleY(.45); } 18% { transform: scaleY(1); } 38% { transform: scaleY(.62); } 58% { transform: scaleY(.94); } 78% { transform: scaleY(.5); } }
    @keyframes eq1 { 0%,100% { transform: scaleY(.7); } 22% { transform: scaleY(.4); } 46% { transform: scaleY(1); } 70% { transform: scaleY(.58); } 86% { transform: scaleY(.9); } }
    @keyframes eq2 { 0%,100% { transform: scaleY(.55); } 15% { transform: scaleY(.92); } 40% { transform: scaleY(.42); } 64% { transform: scaleY(1); } 82% { transform: scaleY(.66); } }
    @keyframes eq3 { 0%,100% { transform: scaleY(.9); } 25% { transform: scaleY(.5); } 50% { transform: scaleY(.98); } 72% { transform: scaleY(.4); } 90% { transform: scaleY(.75); } }
  </style>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b6ff2e" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#b6ff2e" fill-opacity="0.03"/>
    </pattern>
    <linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ff2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b6ff2e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#b6ff2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaffb0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eaffb0" stop-opacity="1"/>
      <stop offset="1" stop-color="#eaffb0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rail"><rect x="24" y="0" width="932" height="346"/></clipPath>
    <linearGradient id="barg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6aa312"/>
      <stop offset="0.62" stop-color="#c6ff55"/>
      <stop offset="1" stop-color="#ff2e4d"/>
    </linearGradient>
    <pattern id="segs" width="6" height="6" patternUnits="userSpaceOnUse"><rect y="2" width="6" height="4" fill="#fff"/></pattern>
    <mask id="seg" maskUnits="userSpaceOnUse" x="0" y="0" width="980" height="346"><rect width="980" height="346" fill="url(#segs)"/></mask>
    <filter id="glowbars" filterUnits="userSpaceOnUse" x="0" y="70" width="980" height="220">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

