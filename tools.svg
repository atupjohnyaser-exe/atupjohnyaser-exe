<svg xmlns="http://www.w3.org/2000/svg" width="980" height="130" viewBox="0 0 980 130" role="img" aria-label="Tools on record">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Arial Narrow', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .lime { fill: #b6ff2e; }
    .txt { fill: #eef3ee; }
    .dim { fill: #5f705f; }
  </style>
  <rect width="980" height="130" fill="#0a0d0a"/>

  <text x="10" y="30" class="sans lime" font-size="15" letter-spacing="1.5">TOOLS ON RECORD</text>
  <rect x="10" y="39" width="960" height="1" fill="#2c3a2c"/>

  <g class="mono" text-anchor="middle">
    <rect x="10"  y="58" width="124" height="54" fill="none" stroke="#2c3a2c"/>
    <text x="72"  y="78" class="dim" font-size="10" letter-spacing="1.5">LANGUAGE</text>
    <text x="72"  y="100" class="txt" font-size="14" font-weight="700">PYTHON</text>

    <rect x="148" y="58" width="124" height="54" fill="none" stroke="#2c3a2c"/>
    <text x="210" y="78" class="dim" font-size="10" letter-spacing="1.5">LANGUAGE</text>
    <text x="210" y="100" class="txt" font-size="14" font-weight="700">JAVASCRIPT</text>

    <rect x="286" y="58" width="124" height="54" fill="none" stroke="#2c3a2c"/>
    <text x="348" y="78" class="dim" font-size="10" letter-spacing="1.5">MARKUP</text>
    <text x="348" y="100" class="txt" font-size="14" font-weight="700">HTML</text>

    <rect x="424" y="58" width="124" height="54" fill="none" stroke="#2c3a2c"/>
    <text x="486" y="78" class="dim" font-size="10" letter-spacing="1.5">STYLE</text>
    <text x="486" y="100" class="txt" font-size="14" font-weight="700">CSS</text>

    <rect x="562" y="58" width="124" height="54" fill="none" stroke="#2c3a2c"/>
    <text x="624" y="78" class="dim" font-size="10" letter-spacing="1.5">VERSION</text>
    <text x="624" y="100" class="txt" font-size="14" font-weight="700">GIT</text>

    <rect x="700" y="58" width="124" height="54" fill="none" stroke="#2c3a2c"/>
    <text x="762" y="78" class="dim" font-size="10" letter-spacing="1.5">PLATFORM</text>
    <text x="762" y="100" class="txt" font-size="14" font-weight="700">GITHUB</text>

    <rect x="838" y="58" width="132" height="54" fill="none" stroke="#b6ff2e"/>
    <text x="904" y="78" class="dim" font-size="10" letter-spacing="1.5">EDITOR</text>
    <text x="904" y="100" class="lime" font-size="14" font-weight="700">VS CODE</text>
  </g>
</svg>
