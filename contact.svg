<svg xmlns="http://www.w3.org/2000/svg" width="980" height="204" viewBox="0 0 980 204" role="img" aria-label="Contact">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: 'Arial Narrow', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
    .lime { fill: #b6ff2e; }
    .red { fill: #ff2e4d; }
    .txt { fill: #eef3ee; }
    .dim { fill: #5f705f; }
    .label { font-size: 11px; letter-spacing: 1.5px; }
    .val { font-size: 17px; }
    .fb { transform-box: fill-box; }
    .blip { animation: blip 2s ease-in-out infinite; }
    @keyframes blip { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .sweep { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateY(-70px); } to { transform: translateY(204px); } }
    .shine { animation: shine 5s linear infinite; }
    @keyframes shine { from { transform: translateX(-160px); } to { transform: translateX(1000px); } }
    .brk { animation: brk 3s ease-in-out infinite; }
    @keyframes brk { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .ring { transform-origin: center; animation: ring 2s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .march { animation: march 24s linear infinite; }
    @keyframes march { from { transform: translateX(0); } to { transform: translateX(-932px); } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .btn { animation: btn 2.6s ease-in-out infinite; }
    @keyframes btn { 0%, 100% { opacity: .88; } 50% { opacity: 1; } }
    .bshine { animation: bshine 3.6s ease-in-out infinite; }
    @keyframes bshine { from { transform: translateX(-130px); } 60%, to { transform: translateX(320px); } }
  </style>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b6ff2e" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#b6ff2e" fill-opacity="0.03"/>
    </pattern>
    <linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ff2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b6ff2e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#b6ff2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaffb0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eaffb0" stop-opacity="1"/>
      <stop offset="1" stop-color="#eaffb0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rail"><rect x="24" y="0" width="932" height="204"/></clipPath>
    <clipPath id="btnclip"><rect x="24" y="72" width="300" height="46"/></clipPath>
    <clipPath id="tick"><rect x="24" y="128" width="932" height="18"/></clipPath>
  </defs>

  <rect width="980" height="204" fill="#0a0d0a"/>
  <rect width="980" height="204" fill="url(#grid)"/>
  <rect width="980" height="204" fill="url(#lines)"/>
  <path d="M0.5 0V204M979.5 0V204" stroke="#2c3a2c" fill="none"/>

  <path d="M0.5 203.5H979.5" stroke="#2c3a2c" fill="none"/>
  <path class="brk" d="M2 182V202H22M978 182V202H958" stroke="#ff2e4d" stroke-width="2" fill="none" filter="url(#glow)"/>
  <rect x="24" y="46" width="932" height="1" fill="#2c3a2c"/>
  <path d="M24 47L33 18H121L131 47Z" fill="#b6ff2e"/>
  <text x="40" y="37" class="sans" font-size="15" letter-spacing="1.5" fill="#0a0d0a" textLength="67" lengthAdjust="spacing">CONTACT</text>
  <circle class="blip" cx="854.0" cy="32.5" r="2.5" fill="#b6ff2e" style="animation-delay:0.0s"/>
  <text x="956" y="36" class="mono dim" font-size="10" letter-spacing="1.5" text-anchor="end" textLength="90" lengthAdjust="spacing">CHANNEL OPEN</text>
  <rect class="btn" x="24" y="72" width="300" height="46" fill="#b6ff2e" filter="url(#glow)"/>
  <g clip-path="url(#btnclip)"><rect class="bshine" x="24" y="72" width="110" height="46" fill="url(#shineg)" opacity="0.75"/></g>
  <text x="174" y="100" class="mono" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#0a0d0a">OPEN GITHUB PROFILE ▸</text>
  <text x="348" y="100" class="mono dim" font-size="13" letter-spacing="1" textLength="230" lengthAdjust="spacing">github.com/ASHTHRONE56-exe</text>
  <rect class="cur" x="586" y="88" width="9" height="16" fill="#ff2e4d" filter="url(#glow)"/>
  <g clip-path="url(#tick)">
    <g class="march mono dim" font-size="10" letter-spacing="1.5">
      <text x="24" y="141" textLength="932" lengthAdjust="spacing">// ASHTHRONE56-exe // DEVELOPER // STATUS: ONLINE // OPEN FOR COLLABORATION // BUILDING IN PUBLIC // SIGNAL STABLE //</text>
      <text x="956" y="141" textLength="932" lengthAdjust="spacing">// ASHTHRONE56-exe // DEVELOPER // STATUS: ONLINE // OPEN FOR COLLABORATION // BUILDING IN PUBLIC // SIGNAL STABLE //</text>
    </g>
  </g>
  <rect x="24" y="156" width="932" height="2" fill="#ff2e4d" filter="url(#glow)"/>
  <text x="490" y="184" class="mono dim" font-size="11" letter-spacing="2" text-anchor="middle">FILE RP-ASH // RECORDS DIVISION // <tspan fill="#ff2e4d">END OF REPORT</tspan></text>

  <g clip-path="url(#rail)">
    <rect class="shine" x="0" y="44" width="160" height="4" fill="url(#shineg)" opacity="0.6" style="animation-delay:-1s"/>
    <rect class="shine" x="0" y="154" width="160" height="6" fill="url(#shineg)" opacity="1" style="animation-delay:-2.5s"/>
  </g>
  <rect class="sweep" x="0" y="0" width="980" height="70" fill="url(#sweepg)"/>
</svg>
